name: Deploy Fove to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_PAGES_REPOSITORY: ${{ secrets.TARGET_PAGES_REPOSITORY }}
      TARGET_PAGES_BRANCH: ${{ secrets.TARGET_PAGES_BRANCH || 'main' }}
      TARGET_PAGES_PATH: fove

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Checkout target GitHub Pages repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_PAGES_REPOSITORY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.TARGET_PAGES_BRANCH }}
          path: pages-repo

      - name: Deploy built files to /fove path
        run: |
          rm -rf pages-repo/${{ env.TARGET_PAGES_PATH }}
          mkdir -p pages-repo/${{ env.TARGET_PAGES_PATH }}
          cp -a dist/. pages-repo/${{ env.TARGET_PAGES_PATH }}/
          cd pages-repo
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A "${{ env.TARGET_PAGES_PATH }}"
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Deploy Fove static site to /${{ env.TARGET_PAGES_PATH }} from ${{ github.repository }}@${{ github.sha }}"
          git push origin HEAD
